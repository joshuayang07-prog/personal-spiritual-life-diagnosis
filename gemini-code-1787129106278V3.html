              <label class="flex items-center gap-2 p-2.5 border rounded-xl text-xs sm:text-sm cursor-pointer has-[:checked]:bg-stone-800 has-[:checked]:text-white has-[:checked]:border-stone-800 transition">
                <input type="radio" name="p4_limit" value="3 經常如此" class="hidden">
                <span class="w-2 h-2 rounded-full border border-current inline-block"></span> 3 經常如此
              </label>
              <label class="flex items-center gap-2 p-2.5 border rounded-xl text-xs sm:text-sm cursor-pointer has-[:checked]:bg-stone-800 has-[:checked]:text-white has-[:checked]:border-stone-800 transition">
                <input type="radio" name="p4_limit" value="4 幾乎總是如此" class="hidden">
                <span class="w-2 h-2 rounded-full border border-current inline-block"></span> 4 幾乎總是如此
              </label>
            </div>
          </div>

          <div>
            <label class="font-medium block mb-1">辨識當前季節：我目前處於人生什麼樣的季節？（如：家有幼兒、剛換工作的混亂期、關係的重創、或靈魂的黑夜）</label>
            <input type="text" name="p4_season" class="w-full p-2.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-800" placeholder="寫下當前的季節...">
          </div>

          <div>
            <label class="font-medium block mb-1">修院的鐘聲：在目前的季節中，哪些突發的打斷是我能轉化為「放下主權、操練捨己之愛」的修院鐘聲？</label>
            <input type="text" name="p4_bell" class="w-full p-2.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-800" placeholder="寫下那些打斷時刻...">
          </div>

          <div>
            <label class="font-medium block mb-1">無情地剔除匆忙：為了在日程表中挪出空間與耶穌在一起，我最需要進行什麼「減法」？我願意對哪些事或義務說「不」？</label>
            <input type="text" name="p4_subtraction" class="w-full p-2.5 border rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-800" placeholder="寫下準備剔除的事物...">
          </div>
        </div>
      </section>

      <!-- 小組行動 -->
      <section class="bg-emerald-900 text-white p-5 rounded-2xl shadow-sm">
        <h2 class="text-base font-bold border-b border-emerald-700 pb-2 mb-3">👣 小組行動：走向你的下一小步</h2>
        
        <div class="space-y-4 text-sm">
          <div>
            <label class="block mb-1 font-medium">1. 這份問卷中，最讓你感到被光照或扎心的是哪一個部分？</label>
            <textarea name="action_conviction" rows="2" class="w-full p-2.5 text-stone-900 rounded-xl focus:outline-none" placeholder="記錄觸動..."></textarea>
          </div>

          <div>
            <label class="block mb-1 font-medium">2. 未來一週內，你打算採取的「一個微小且充滿樂趣的改變習慣」是什麼？</label>
            <input type="text" name="action_habit" class="w-full p-2.5 text-stone-900 rounded-xl focus:outline-none" placeholder="例如：每晚 8:30 手機上床睡覺、清晨給神五分鐘靜默...">
          </div>
        </div>
      </section>

      <!-- 按鈕區 -->
      <div class="space-y-3 pt-2">
        <button type="button" onclick="saveData()" class="w-full bg-stone-900 text-white py-3.5 rounded-xl font-bold tracking-wider hover:bg-stone-800 shadow-md transition flex items-center justify-center gap-2">
          <span>💾 儲存並產出結果</span>
        </button>
      </div>
    </form>

    <!-- 結果展示與匯出區域 -->
    <div id="resultModal" class="hidden mt-6 space-y-4">
      
      <!-- 匯出按鈕群 -->
      <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex flex-col sm:flex-row gap-2.5">
        <button onclick="downloadPDF()" class="flex-1 bg-emerald-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow hover:bg-emerald-800 flex items-center justify-center gap-2 transition">
          📄 下載完整 PDF 報告
        </button>
        <button onclick="window.print()" class="flex-1 bg-white border border-emerald-700 text-emerald-800 py-3 px-4 rounded-xl font-bold text-sm hover:bg-emerald-100 flex items-center justify-center gap-2 transition">
          🖨️ 系統列印 / 存為 PDF
        </button>
      </div>

      <!-- 預覽/PDF渲染專用容器 -->
      <div id="pdfReport" class="bg-white border border-stone-300 rounded-2xl p-6 shadow-md text-stone-800 space-y-5">
        <div class="border-b pb-3 text-center">
          <h2 class="text-xl font-bold text-stone-900">個人靈命與生活模式自我診斷報告</h2>
          <p class="text-xs text-stone-500 mt-1" id="reportDate"></p>
        </div>

        <!-- 小組分享精華卡 -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
          <h3 class="font-bold text-emerald-900 text-sm mb-2">🌿 小組聚會分享摘要</h3>
          <div id="shareSummary" class="text-xs space-y-1.5 leading-relaxed text-emerald-950 whitespace-pre-line"></div>
        </div>

        <!-- 各部分完整明細 -->
        <div id="fullReportDetails" class="space-y-4 text-xs"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'spiritual_audit_data_v2';

    // 頁面載入時自動讀取 LocalStorage
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      
      const data = JSON.parse(saved);
      const form = document.getElementById('auditForm');

      for (const [key, value] of Object.entries(data)) {
        if (Array.isArray(value)) {
          value.forEach(v => {
            const el = form.querySelector(`[name="${key}"][value="${v}"]`);
            if (el) el.checked = true;
          });
        } else {
          const el = form.elements[key];
          if (el) {
            if (el.type === 'radio' || el.length > 1) {
              const radio = form.querySelector(`[name="${key}"][value="${value}"]`);
              if (radio) radio.checked = true;
            } else {
              el.value = value;
            }
          }
        }
      }
    });

    // 儲存並在前端渲染出報告卡
    function saveData() {
      const form = document.getElementById('auditForm');
      const formData = new FormData(form);
      const result = {};

      for (const [key, value] of formData.entries()) {
        if (result[key]) {
          if (!Array.isArray(result[key])) result[key] = [result[key]];
          result[key].push(value);
        } else {
          result[key] = value;
        }
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
      renderReport(result);

      document.getElementById('resultModal').classList.remove('hidden');
      document.getElementById('resultModal').scrollIntoView({ behavior: 'smooth' });
    }

    // 渲染報告內容
    function renderReport(data) {
      document.getElementById('reportDate').textContent = `盤點日期：${new Date().toLocaleDateString('zh-TW')}`;

      // 分享卡摘要
      const shareText = `【當前季節】${data.p4_season || '未填寫'}
【無情減法】${data.p4_subtraction || '未填寫'}
【被光照扎心之處】${data.action_conviction || '未填寫'}
【本週微小改變習慣】${data.action_habit || '未填寫'}`;
      document.getElementById('shareSummary').textContent = shareText;

      // 完整細節
      const refugeList = Array.isArray(data.p2_refuge) ? data.p2_refuge.join('、') : (data.p2_refuge || '未勾選');
      
      const detailsHtml = `
        <div class="border-t pt-3">
          <h4 class="font-bold text-stone-900 text-sm mb-1.5">第一部分：愛的關係與品格檢視</h4>
          <ul class="list-disc pl-4 space-y-1">
            <li>最親近之人回饋：<b>${data.p1_q1 || '未評分'}</b></li>
            <li>面對傷害的反應：<b>${data.p1_q2 || '未評分'}</b></li>
            <li>對仇敵/不同立場者的愛：<b>${data.p1_q3 || '未評分'}</b></li>
            <li>衝突深度反思：<span class="text-stone-600">${data.p1_reflect || '無'}</span></li>
          </ul>
        </div>

        <div class="border-t pt-3">
          <h4 class="font-bold text-stone-900 text-sm mb-1.5">第二部分：情感基調與「情感住所」</h4>
          <ul class="list-disc pl-4 space-y-1">
            <li>日常情感基調（焦慮/疏遠）：<b>${data.p2_q1 || '未評分'}</b></li>
            <li>零碎空檔的心思定向：<b>${data.p2_q2 || '未評分'}</b></li>
            <li>直覺情感避難所：<b>${refugeList}</b></li>
            <li>大腦指北針反思：<span class="text-stone-600">${data.p2_reflect || '無'}</span></li>
          </ul>
        </div>

        <div class="border-t pt-3">
          <h4 class="font-bold text-stone-900 text-sm mb-1.5">第三部分：日常習慣與生活塑造</h4>
          <ul class="list-disc pl-4 space-y-1">
            <li>晨間第一件事：<b>${data.p3_morning || '未填寫'}</b></li>
            <li>資訊與聖經佔比失衡：<b>${data.p3_media || '未填寫'}</b></li>
            <li>世俗成功與金錢綑綁：<b>${data.p3_money || '未評分'}</b></li>
            <li>同溫層塑造力量：<b>${data.p3_circle || '未評分'}</b></li>
            <li>時間分配與日常儀式反思：<span class="text-stone-600">${data.p3_reflect || '無'}</span></li>
          </ul>
        </div>

        <div class="border-t pt-3">
          <h4 class="font-bold text-stone-900 text-sm mb-1.5">第四部分：人生季節、限制與「減法」</h4>
          <ul class="list-disc pl-4 space-y-1">
            <li>誠實接納限制：<b>${data.p4_limit || '未評分'}</b></li>
            <li>辨識當前季節：<b>${data.p4_season || '未填寫'}</b></li>
            <li>修院的鐘聲：<span class="text-stone-600">${data.p4_bell || '未填寫'}</span></li>
            <li>無情地剔除匆忙（減法）：<span class="text-stone-600">${data.p4_subtraction || '未填寫'}</span></li>
          </ul>
        </div>
      `;
      document.getElementById('fullReportDetails').innerHTML = detailsHtml;
    }

    // 匯出 PDF 功能
    function downloadPDF() {
      const element = document.getElementById('pdfReport');
      const today = new Date().toISOString().slice(0,10);
      
      const opt = {
        margin:       10,
        filename:     `靈命自我診斷報告_${today}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
